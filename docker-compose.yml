services:
  # 1. POSTGIS-DATENBANK-DIENST (Die geografische Basis)
  polaris-db:
    image: postgis/postgis:16-3.4
    container_name: polaris-postgis-gateway
    restart: always
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. DER LOKALE SYNAPSE-SERVER (Der autarke Matrix-Knoten für den Inselmodus)
  synapse:
    image: matrixdotorg/synapse:latest
    container_name: polaris-synapse
    restart: always
    ports:
      - "8008:8008"
      - "8000:8000"
    volumes:
      - ./synapse-data:/data
      # Mappt den gesamten www-Ordner in das statische Webverzeichnis von Synapse
      - /srv/docker/polaris/www:/usr/local/lib/python3.13/site-packages/synapse/static
    environment:
      - SYNAPSE_SERVER_NAME=${MATRIX_SERVER_NAME}
      - SYNAPSE_REPORT_STATS=no
      - SYNAPSE_ENABLE_REGISTRATION=yes
    depends_on:
      polaris-db:
        condition: service_healthy

  # 3. DAS RUST GEOFENCE GATEWAY
  polaris-gateway:
    build:
      context: ./services/matrix-gateway
      dockerfile: Dockerfile
    container_name: polaris-gateway
    restart: always
    env_file:
      - .env
    volumes:
      # 🎯 DAS ORDNUNGS-GEHEIMNIS: Spiegelt die EINZIGE Haupt-.env direkt in das App-Verzeichnis des Bots!
      - ./.env:/app/.env:ro
    depends_on:
      polaris-db:
        condition: service_healthy
      synapse:
        condition: service_started
