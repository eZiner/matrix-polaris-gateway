version: '3.8'

services:
  # 🌐 POSTGIS-DATENBANK-DIENST
  polaris-db:
    # Wir nutzen das offizielle, hochoptimierte PostGIS-Image (Postgres 16 + PostGIS 3.4)
    image: postgis/postgis:16-3.4
    container_name: polaris-postgis-gateway
    restart: always
    environment:
      # Diese Variablen greifen beim allerersten Start und erzeugen deine Struktur
      - POSTGRES_USER=polaris
      - POSTGRES_PASSWORD=vG0YEhWplJql2boa1usU # Entspricht deiner heutigen lokalen .env
      - POSTGRES_DB=polaris_geo # Exakt der Name aus deiner produktiven Konfiguration!
    ports:
      # Spiegelt den Postgres-Standardport nach außen auf deinen Localhost
      - "5432:5432"
    volumes:
      # Sichert die Geometrie-Daten dauerhaft auf deiner Festplatte (überlebt Container-Restarts)
      - polaris_postgres_data:/var/lib/postgresql/data
    healthcheck:
      # Sichert ab, dass das geplante Rust-Gateway erst startet, wenn PostGIS bereit ist
      test: ["CMD-SHELL", "pg_isready -U polaris -d polaris_geo"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  # Das persistente Docker-Volume für deine BKG- und OSM-Geometrien
  polaris_postgres_data:
    driver: local
