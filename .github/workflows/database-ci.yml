name: POLARIS Database Pipelines CI

on:
  push:
    paths:
      - 'database/**'
      - '.github/workflows/database-ci.yml'
  pull_request:
    paths:
      - 'database/**'

jobs:
  test-database:
    runs-on: ubuntu-latest

    steps:
    - name: Quellcode auschecken
      uses: actions/checkout@v4

    - name: Python initialisieren
      uses: actions/setup-python@v5
      with:
        python-version: '3.10' # Passend zur lokalen WSL-Umgebung
        cache: 'pip'

    - name: System-Abhängigkeiten installieren
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libpq-dev

    - name: Python-Abhängigkeiten installieren
      run: |
        cd database/
        python -m pip install --upgrade pip
        # Wir nutzen hier den normalen pip-install, da uv auf nackten CI-Servern erst geladen werden müsste
        pip install -r requirements.txt
        pip install flake8

    - name: Syntax-Prüfung (Linter)
      run: |
        # Stop bei Syntax-Fehlern oder ungelösten Importen im Datenbank-Ordner
        flake8 database/ --count --select=E9,F63,F7,F82 --show-source --statistics