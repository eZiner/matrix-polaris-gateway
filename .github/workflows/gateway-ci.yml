name: POLARIS Rust Gateway CI

on:
  push:
    paths:
      - 'services/matrix-gateway/**'
      - '.github/workflows/gateway-ci.yml'
  pull_request:
    paths:
      - 'services/matrix-gateway/**'

jobs:
  build-gateway:
    runs-on: ubuntu-latest

    steps:
    - name: Quellcode auschecken
      uses: actions/checkout@v4

    - name: Rust Toolchain initialisieren
      uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy, rustfmt

    - name: Rust Cache aktivieren
      uses: swatinem/rust-cache@v2
      with:
        workspaces: "services/matrix-gateway -> target"

    - name: System-Abhängigkeiten installieren
      run: |
        sudo apt-get update
        sudo apt-get install -y pkg-config libssl-dev

    - name: Code-Formatierung prüfen
      run: |
        cd services/matrix-gateway/
        cargo fmt --check

    - name: Kompilierung im SQLx-Offline-Modus prüfen
      env:
        SQLX_OFFLINE: true
      run: |
        cd services/matrix-gateway/
        cargo check --release

    - name: Sicherheits- und Qualitätsprüfung (Clippy)
      env:
        SQLX_OFFLINE: true
      run: |
        cd services/matrix-gateway/
        cargo clippy -- -D warnings