<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Rathaus Schadensmeldung 8</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #f9f9f9; color: #333; max-width: 500px; margin: 0 auto; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; }
        input, select, textarea { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        button { background: #007acd; color: white; border: none; padding: 12px 15px; border-radius: 4px; cursor: pointer; font-size: 16px; width: 100%; font-weight: bold; }
        button:hover { background: #00599a; }
        .success-box { background: #e6f4ea; border: 1px solid #137333; padding: 15px; border-radius: 6px; margin-top: 10px; }
        .copy-area { width: 100%; background: #fff; border: 1px solid #ccc; padding: 10px; font-family: monospace; white-space: pre-wrap; margin: 15px 0; border-radius: 4px; box-sizing: border-box; }
    </style>
</head>
<body>

    <h3>🏛️ Schaden online melden</h3>
    
    <div id="main-content">
        <div id="form-container">
            <div class="form-group">
                <label for="category">Art des Schadens:</label>
                <select id="category">
                    <option value="Schlagloch">🕳️ Schlagloch / Straßenschaden</option>
                    <option value="Laterne">💡 Defekte Straßenbeleuchtung</option>
                    <option value="Müll">🗑️ Wilde Müllkippe</option>
                    <option value="Sonstiges">🛠️ Sonstiges</option>
                </select>
            </div>

            <div class="form-group">
                <label for="location">Ort / Adresse:</label>
                <input type="text" id="location" placeholder="z.B. Am Badstubenberg 11">
            </div>

            <div class="form-group">
                <label for="description">Details / Beschreibung:</label>
                <textarea id="description" rows="3" placeholder="Beschreibe den Schaden genauer..."></textarea>
            </div>

            <button id="submit-btn" onclick="generateReport()">Meldung generieren</button>
        </div>
    </div>

    <script>
        function generateReport() {
            const category = document.getElementById('category').value;
            const location = document.getElementById('location').value;
            const description = document.getElementById('description').value;

            if (!location.trim()) {
                alert("Bitte gib einen Ort oder eine Adresse an!");
                return;
            }

            // Der standardisierte Textblock für deinen Bot
            const textBody = "[Formular-Daten]\nTyp: " + category + "\nOrt: " + location + "\nDetails: " + description;

            // Wir bauen die Ansicht komplett lokal um – ohne Weiterleitung, ohne IFrame-Zwang
            document.getElementById('main-content').innerHTML = `
                <div class="success-box">
                    <h4 style="color: #137333; margin-top: 0; margin-bottom: 10px;">📋 Daten erfolgreich vorbereitet!</h4>
                    <p style="margin: 0; font-size: 14px;">Klicke unten auf den Button, um den Text zu kopieren. Füge ihn danach einfach mit <strong>Strg + V</strong> im Matrix-Chat ein und sende ihn ab.</p>
                </div>
                
                <div class="copy-area" id="text-to-copy">${textBody}</div>
                
                <button id="copy-btn" onclick="copyToClipboard()" style="background: #25D366;">🗐 Text kopieren</button>
            `;
        }

        function copyToClipboard() {
            const text = document.getElementById('text-to-copy').innerText;
            const button = document.getElementById('copy-btn');
            
            navigator.clipboard.writeText(text).then(() => {
                button.innerText = "✓ Kopiert!";
                button.style.background = "#137333";
                setTimeout(() => {
                    button.innerText = "🗐 Text erneut kopieren";
                    button.style.background = "#25D366";
                }, 2000);
            }).catch(err => {
                alert("Automatisches Kopieren fehlgeschlagen. Bitte kopiere den Text manuell aus der Box.");
            });
        }
    </script>
</body>
</html>
